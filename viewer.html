<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Castle Builder - Retro 2D Architecture Supervisor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #141721;
      color: #e2e8f0;
      font-family: monospace, -apple-system, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      image-rendering: pixelated;
    }
    #canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 20px;
    }
    #hud {
      width: 380px;
      background: #1a1e2d;
      border-left: 2px solid #2d3348;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .pixel-box {
      background: #141721;
      border: 2px solid #2d3348;
      padding: 16px;
      position: relative;
    }
    .pixel-box.alert {
      border-color: #e06c75;
      background: #1f1a24;
    }
    .castle-svg {
      width: 100%;
      max-width: 620px;
      height: auto;
      filter: drop-shadow(0 10px 0 rgba(0,0,0,0.4));
    }
    .layer-group {
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .layer-group:hover {
      opacity: 0.9;
    }
    .pixel-line {
      shape-rendering: crispEdges;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: bold;
      background: #2d3348;
      color: #98c379;
    }
    .badge.danger {
      background: #4c2229;
      color: #e06c75;
    }
    .badge.warning {
      background: #4a3e20;
      color: #e5c07b;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      background: #212638;
      border: 2px solid #2d3348;
      color: #abb2bf;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      text-align: left;
    }
    .btn:hover {
      background: #2d3348;
      color: #fff;
    }
    .btn.primary {
      border-color: #61afef;
      color: #61afef;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
